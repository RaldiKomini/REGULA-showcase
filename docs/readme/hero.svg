m, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9c9c9" text-anchor="middle">321 tests</text><text x="64" y="360" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5c5c63" text-anchor="start">Not legal advice or a certification: an aid for the DPO, the lawyer and the founder.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
